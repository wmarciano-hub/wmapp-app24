version: '3.8'

services:
  # Serviço principal do n8n (UI, agendador, orquestrador)
  n8n-main:
    image: n8nio/n8n:latest
    container_name: n8n-main
    restart: unless-stopped
    ports:
      - "5678:5678"  # expõe a UI do n8n na porta 5678
    environment:
      - N8N_ENCRYPTION_KEY=SEU_SEGREDO_UNICO   # chave de criptografia (mesma em todos os containers n8n)
      - EXECUTIONS_MODE=queue                 # habilita modo fila&#8203;:contentReference[oaicite:13]{index=13}
      - N8N_DISABLE_PRODUCTION_MAIN_PROCESS=true  # não processa webhooks aqui&#8203;:contentReference[oaicite:14]{index=14}
      - WEBHOOK_URL=https://n8n.seu-dominio.com/  # URL pública base dos webhooks&#8203;:contentReference[oaicite:15]{index=15}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=senha_postgres
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      # - QUEUE_BULL_REDIS_PASSWORD=senha_redis   # (descomente se Redis requer autenticação)
    depends_on:
      - postgres
      - redis
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # Serviço de workers do n8n (15 réplicas para execuções em paralelo)
  n8n-worker:
    image: n8nio/n8n:latest
    container_name: n8n-worker
    restart: unless-stopped
    environment:
      - N8N_ENCRYPTION_KEY=SEU_SEGREDO_UNICO   # mesma chave do n8n-main&#8203;:contentReference[oaicite:16]{index=16}
      - EXECUTIONS_MODE=queue
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=senha_postgres
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      # - QUEUE_BULL_REDIS_PASSWORD=senha_redis
    # Espera alguns segundos para garantir que postgres/redis já inicializaram, então inicia em modo worker&#8203;:contentReference[oaicite:17]{index=17}
    command: /bin/sh -c "sleep 5; n8n worker"
    depends_on:
      - postgres
      - redis
    deploy:
      replicas: 15
      restart_policy:
        condition: any

  # Serviço de processadores de Webhook do n8n (opcional, para escalonar webhooks)
  n8n-webhook:
    image: n8nio/n8n:latest
    container_name: n8n-webhook
    restart: unless-stopped
    environment:
      - N8N_ENCRYPTION_KEY=SEU_SEGREDO_UNICO   # mesma chave de criptografia
      - EXECUTIONS_MODE=queue
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=senha_postgres
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      # - QUEUE_BULL_REDIS_PASSWORD=senha_redis
    command: /bin/sh -c "sleep 5; n8n webhook"  # inicia processo dedicado a webhooks&#8203;:contentReference[oaicite:18]{index=18}
    depends_on:
      - postgres
      - redis
    deploy:
      replicas: 2   # pode ajustar o número de processadores de webhook conforme a carga
      restart_policy:
        condition: any

  # Banco de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=senha_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
    networks:
      - n8n-network

  # Servidor Redis para a fila BullMQ
  redis:
    image: redis:6-alpine
    container_name: n8n-redis
    restart: unless-stopped
    # Para habilitar senha no Redis, utilize REDIS_PASSWORD e configure requirepass, etc. em um arquivo de configuração do Redis
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
    networks:
      - n8n-network

networks:
  n8n-network:
    driver: overlay  # rede overlay (Swarm) compartilhada entre os serviços

volumes:
  postgres_data:
  redis_data:

